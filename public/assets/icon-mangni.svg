<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Mangni / Ring Exchange Icon -->
  <defs>
    <radialGradient id="gemSparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd9a8" />
      <stop offset="100%" stop-color="#d4af7a" />
    </radialGradient>
  </defs>
  <!-- Background disc -->
  <circle cx="50" cy="50" r="44" fill="rgba(212,175,122,0.08)" stroke="#d4af7a" stroke-width="1.2" stroke-dasharray="3 3" />
  
  <!-- Interlocking Rings -->
  <!-- Ring 1 -->
  <circle cx="42" cy="54" r="20" stroke="#d4af7a" stroke-width="3" />
  <!-- Ring 2 -->
  <circle cx="58" cy="54" r="20" stroke="#e8b4b8" stroke-width="3" />
  
  <!-- Diamond Setting on Ring 1 -->
  <polygon points="42,24 49,32 42,40 35,32" fill="url(#gemSparkle)" stroke="#d4af7a" stroke-width="1" />
  <!-- Sparkle light rays -->
  <line x1="42" y1="18" x2="42" y2="22" stroke="#ffd9a8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="30" y1="28" x2="34" y2="30" stroke="#ffd9a8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="54" y1="28" x2="50" y2="30" stroke="#ffd9a8" stroke-width="1.5" stroke-linecap="round" />
</svg>
