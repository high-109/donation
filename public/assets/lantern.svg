<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" fill="none" stroke="currentColor">
  <defs>
    <radialGradient id="lanternCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4dd" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ffd9a8" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#e8b4b8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d4af7a" stop-opacity="0" />
    </radialGradient>
    <filter id="lanternBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Top hanging chain -->
  <line x1="60" y1="0" x2="60" y2="40" stroke="#d4af7a" stroke-width="2" stroke-dasharray="3 2" />
  <circle cx="60" cy="42" r="4" fill="#d4af7a" />
  <!-- Dome canopy -->
  <path d="M42 56 C42 46, 52 46, 60 46 C68 46, 78 46, 78 56 Z" fill="#3a2540" stroke="#d4af7a" stroke-width="1.8" />
  <path d="M30 68 C35 58, 48 56, 60 56 C72 56, 85 58, 90 68 Z" fill="#2b1a2e" stroke="#d4af7a" stroke-width="1.8" />
  <!-- Finials on canopy -->
  <circle cx="60" cy="46" r="2.5" fill="#ffd9a8" />
  <!-- Glowing center body chamber -->
  <circle cx="60" cy="120" r="38" fill="url(#lanternCoreGlow)" filter="url(#lanternBloom)" />
  <!-- Glass facets and outer ribs -->
  <path d="M34 72 L22 110 C20 125, 24 140, 34 165 L46 182 L74 182 L86 165 C96 140, 100 125, 98 110 L86 72 Z" fill="rgba(58,37,64,0.3)" stroke="#d4af7a" stroke-width="2" />
  <!-- Filigree arches -->
  <path d="M60 72 L60 182" stroke="#d4af7a" stroke-width="1.5" stroke-dasharray="4 2" />
  <path d="M45 74 C40 100, 38 135, 50 178" stroke="#d4af7a" stroke-width="1.2" />
  <path d="M75 74 C80 100, 82 135, 70 178" stroke="#d4af7a" stroke-width="1.2" />
  <path d="M34 110 C45 118, 75 118, 86 110" stroke="#d4af7a" stroke-width="1.2" fill="none" />
  <path d="M30 135 C45 145, 75 145, 90 135" stroke="#d4af7a" stroke-width="1.2" fill="none" />
  <!-- Flickering candle flame inside -->
  <g class="lantern-flame" id="lanternFlame">
    <path d="M60 135 C57 130, 56 122, 60 112 C64 122, 63 130, 60 135 Z" fill="#fffbe8" stroke="#ffd9a8" stroke-width="1" />
    <circle cx="60" cy="125" r="3" fill="#ffe19c" />
  </g>
  <!-- Lower base and pendant drop -->
  <path d="M44 182 L50 200 L70 200 L76 182 Z" fill="#3a2540" stroke="#d4af7a" stroke-width="1.8" />
  <path d="M54 200 L60 215 L66 200 Z" fill="#d4af7a" />
  <line x1="60" y1="215" x2="60" y2="235" stroke="#d4af7a" stroke-width="1.5" />
  <circle cx="60" cy="240" r="5" fill="#d4af7a" stroke="#ffd9a8" stroke-width="1.2" />
  <path d="M60 245 L60 265" stroke="#d4af7a" stroke-width="1.2" stroke-linecap="round" />
</svg>
