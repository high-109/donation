  <circle cx="150" cy="50" r="4" fill="#ffd9a8" />
  <circle cx="150" cy="70" r="5" fill="#e8b4b8" />
  
  <!-- Cluster 3 (Center large tassel) -->
  <line x1="300" y1="15" x2="300" y2="105" stroke="#d4af7a" stroke-width="1.4" />
  <circle cx="300" cy="35" r="3.5" fill="#ffd9a8" />
