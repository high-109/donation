<!doctype html>
<html lang="en" data-theme="light-ivory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f0" />
    
    <title>Hammad &amp; Ayesha — Engagement Ceremony</title>
    <meta name="description" content="A luxury, light-themed digital engagement invitation celebrating Hammad Sheikh &amp; Ayesha Akram at Ghanchi Community Banquet." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ais-dev-bfh7ph6f537waw6ujpim4i-204913879995.asia-southeast1.run.app" />
    <meta property="og:title" content="Hammad &amp; Ayesha — Engagement Ceremony" />
    <meta property="og:description" content="A luxury, light-themed digital engagement invitation celebrating Hammad Sheikh &amp; Ayesha Akram at Ghanchi Community Banquet." />
    <meta property="og:image" content="/assets/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hammad &amp; Ayesha — Engagement Ceremony" />
    <meta name="twitter:description" content="A luxury, light-themed digital engagement invitation celebrating Hammad Sheikh &amp; Ayesha Akram at Ghanchi Community Banquet." />
    <meta name="twitter:image" content="/assets/og-image.svg" />

    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Cormorant Garamond, Cinzel Decorative, Alex Brush, Amiri, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Skip to content for accessibility -->
    <a href="#hero" class="skip-link">Skip to invitation</a>

    <!-- Top Scroll Progress Bar -->
    <div id="scrollProgressBar" class="scroll-progress-bar" aria-hidden="true"></div>

    <!-- Ambient Floating Particles Canvas (Background layer) -->
    <canvas id="ambientCanvas" class="ambient-canvas" aria-hidden="true"></canvas>

    <!-- Flying Floating Lanterns Canvas (Interactive / Closing layer) -->
    <canvas id="lanternsCanvas" class="lanterns-canvas" aria-hidden="true"></canvas>

    <!-- Desktop Cursor Glow -->
    <div id="cursorGlow" class="cursor-glow" aria-hidden="true"></div>

    <!-- Floating Audio Control -->
    <aside class="floating-controls" aria-label="Page controls">
      <button id="audioToggleBtn" class="floating-btn audio-btn" aria-label="Toggle background music" title="Toggle background ambiance" aria-pressed="false">
        <svg id="audioIconMuted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="23" y1="9" x2="17" y2="15" />
          <line x1="17" y1="9" x2="23" y2="15" />
        </svg>
        <svg id="audioIconPlaying" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
        </svg>
      </button>
    </aside>

    <!-- App Container -->
    <div id="app" class="app-root">
      <!-- 0. Preloader Overlay -->
      <div id="preloader" class="preloader" role="dialog" aria-modal="true" aria-label="Loading invitation"></div>

      <!-- 1. Wax-Seal Envelope Cover -->
      <div id="cover" class="cover-wrapper" role="region" aria-label="Envelope cover"></div>

      <!-- Main Invitation Content -->
      <main id="mainContent" class="main-content">
        <!-- 2. Hero Section -->
        <section id="hero" class="section hero-section"></section>

        <!-- 3. Letter (Scroll-Unrolled Parchment) -->
        <section id="letter" class="section letter-section"></section>

        <!-- 4. Families Section -->
        <section id="families" class="section families-section"></section>

        <!-- 5. The Celebrations (Events) -->
        <section id="celebrations" class="section celebrations-section"></section>

        <!-- 6. Countdown & Scratch Card -->
        <section id="countdown" class="section countdown-section"></section>

        <!-- 7. RSVP Section -->
        <section id="rsvp" class="section rsvp-section"></section>

        <!-- 8. Closing Section -->
        <section id="closing" class="section closing-section"></section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
