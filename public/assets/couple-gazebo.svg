<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <!-- Gazebo Pavilion Structure (Light architectural line art) -->
  <g class="gazebo-structure" stroke="#bfa382" stroke-width="2" stroke-linecap="round">
    <!-- Roof Dome Peak & Finial -->
    <path d="M200 40 L200 15" stroke-width="2.5" />
    <circle cx="200" cy="15" r="4" fill="#d4af7a" stroke="#9e733b" />
    
    <!-- Gazebo Roof Canopy -->
    <polygon points="200,40 80,110 320,110" fill="rgba(245, 237, 226, 0.75)" stroke="#bfa382" stroke-width="2.5" />
    <polygon points="200,40 130,110 270,110" fill="rgba(255, 250, 242, 0.45)" stroke="#bfa382" stroke-width="1.8" />
    <line x1="200" y1="40" x2="200" y2="110" stroke="#bfa382" stroke-width="1.8" stroke-dasharray="3 3" />
    
    <!-- Roof Fascia Bar -->
    <rect x="70" y="110" width="260" height="12" rx="2" fill="#e6d5c1" stroke="#bfa382" stroke-width="1.8" />

    <!-- Gazebo Columns / Pillars -->
    <!-- Far Left Column -->
    <rect x="95" y="122" width="10" height="230" fill="#f2e4d2" stroke="#bfa382" stroke-width="1.8" />
    <!-- Center Left Column -->
    <rect x="145" y="122" width="8" height="230" fill="#f2e4d2" stroke="#bfa382" stroke-width="1.5" />
    <!-- Center Right Column -->
    <rect x="247" y="122" width="8" height="230" fill="#f2e4d2" stroke="#bfa382" stroke-width="1.5" />
    <!-- Far Right Column -->
    <rect x="295" y="122" width="10" height="230" fill="#f2e4d2" stroke="#bfa382" stroke-width="1.8" />

    <!-- Arched Spandrels between columns -->
    <path d="M95 140 C115 125, 125 125, 145 140" fill="none" stroke="#bfa382" stroke-width="1.5" />
    <path d="M153 140 C190 125, 210 125, 247 140" fill="none" stroke="#bfa382" stroke-width="1.5" />
    <path d="M255 140 C275 125, 285 125, 295 140" fill="none" stroke="#bfa382" stroke-width="1.5" />

    <!-- Pavilion Base Floor -->
    <rect x="60" y="352" width="280" height="16" rx="3" fill="#e6d5c1" stroke="#bfa382" stroke-width="2" />
    <rect x="45" y="368" width="310" height="12" rx="2" fill="#d8c3ad" stroke="#bfa382" stroke-width="2" />
  </g>

  <!-- Illustrated Couple Standing in Gazebo -->
  <g class="couple-figure">
    <!-- GROOM (Right side, slightly behind/alongside bride) -->
    <!-- Groom Body & Maroon Velvet Suit/Sherwani -->
    <g class="groom" transform="translate(18, 0)">
      <!-- Legs / Trousers -->
      <rect x="200" y="270" width="18" height="85" rx="3" fill="#1f1118" />
      <rect x="222" y="270" width="18" height="85" rx="3" fill="#1f1118" />
      
      <!-- Sherwani / Velvet Blazer -->
      <path d="M190 190 L248 190 L244 285 L196 285 Z" fill="#5c1524" stroke="#420d18" stroke-width="1.5" />
      <!-- Collar & White Shirt -->
      <polygon points="214,190 220,210 226,190" fill="#ffffff" />
      <line x1="220" y1="210" x2="220" y2="285" stroke="#3d0a15" stroke-width="2" />
      <!-- Buttons -->
      <circle cx="220" cy="225" r="2" fill="#d4af7a" />
      <circle cx="220" cy="240" r="2" fill="#d4af7a" />
      <circle cx="220" cy="255" r="2" fill="#d4af7a" />
      <circle cx="220" cy="270" r="2" fill="#d4af7a" />
      <!-- Pocket Square -->
      <line x1="202" y1="215" x2="210" y2="215" stroke="#ffffff" stroke-width="2" />

      <!-- Groom Neck & Head -->
      <rect x="214" y="174" width="12" height="18" fill="#e2b998" />
      <circle cx="220" cy="165" r="16" fill="#e2b998" />
      <!-- Groom Beard & Hair -->
      <path d="M206 160 C206 148, 234 148, 234 160 L234 166 C234 176, 226 182, 220 182 C214 182, 206 176, 206 166 Z" fill="#1c1618" />
      <!-- Face profile cutout -->
      <path d="M211 157 C211 152, 229 152, 229 157 L229 166 C229 171, 225 174, 220 174 C215 174, 211 171, 211 166 Z" fill="#e2b998" />
      <path d="M213 166 C215 172, 225 172, 227 166 Z" fill="#1c1618" />
    </g>

    <!-- BRIDE (Left side, dusty pink/rose formal gown) -->
    <g class="bride" transform="translate(10, 0)">
      <!-- Voluminous Pink Embroidered Lehenga / Gown -->
      <path d="M165 215 
               C155 235, 120 280, 100 365 
               L225 365 
               C205 280, 175 235, 165 215 Z" 
            fill="#d98f9c" stroke="#bf7381" stroke-width="1.5" />
      
      <!-- Gown pleats and subtle sparkle embroidery folds -->
      <path d="M165 215 C160 260, 145 310, 130 365" stroke="rgba(255, 235, 238, 0.45)" stroke-width="2" />
      <path d="M165 215 C170 260, 175 310, 165 365" stroke="rgba(255, 235, 238, 0.45)" stroke-width="2" />
      <path d="M165 215 C175 260, 190 310, 198 365" stroke="rgba(255, 235, 238, 0.45)" stroke-width="2" />
      
      <!-- Gown Bodice -->
      <path d="M152 195 L178 195 L168 222 L162 222 Z" fill="#c77b89" stroke="#bf7381" stroke-width="1" />
      <!-- Gown Neckline -->
      <path d="M155 195 Q165 204 175 195" fill="none" stroke="#e8a8b4" stroke-width="1.5" />
      
      <!-- Bride Neck & Face -->
      <rect x="160" y="176" width="10" height="18" fill="#e8c2a5" />
      <circle cx="165" cy="168" r="14" fill="#e8c2a5" />
      
      <!-- Bride Long Flowing Dark Hair -->
      <path d="M150 166 
               C150 150, 180 150, 180 166 
               C182 185, 180 205, 182 225 
               C176 220, 174 195, 174 185 
               C160 185, 156 195, 152 220 
               C148 200, 148 180, 150 166 Z" 
            fill="#1c1618" />
      <!-- Soft face profile -->
      <circle cx="165" cy="169" r="10" fill="#e8c2a5" />
      <path d="M156 164 Q165 158 174 164" fill="#1c1618" />
    </g>
  </g>

  <!-- Flowerbed Garden at Gazebo Base (Roses, Jasmine & Green Foliage) -->
  <g class="garden-flowerbed" transform="translate(0, 340)">
    <!-- Foliage bushes -->
    <path d="M40 35 C50 15, 80 10, 100 25 C120 12, 160 10, 180 25 C200 12, 240 10, 260 25 C280 12, 320 10, 340 25 C350 15, 370 20, 375 35 Z" fill="#586f55" />
    <path d="M50 40 C65 25, 95 20, 115 35 C135 22, 175 20, 195 35 C215 22, 255 20, 275 35 C295 22, 335 20, 355 35 Z" fill="#6c8469" />

    <!-- Flowers & Blooms -->
    <!-- Pink and Coral Roses -->
    <circle cx="75" cy="28" r="7" fill="#c45865" />
    <circle cx="75" cy="28" r="3" fill="#f0a4ae" />
    <circle cx="105" cy="22" r="6" fill="#e8d5cc" />
    <circle cx="135" cy="26" r="8" fill="#d98f9c" />
    <circle cx="135" cy="26" r="3.5" fill="#ffd9e0" />
    <circle cx="170" cy="20" r="7" fill="#c45865" />
    <circle cx="200" cy="25" r="8" fill="#ffffff" />
    <circle cx="200" cy="25" r="3" fill="#ffd9a8" />
    <circle cx="230" cy="20" r="7" fill="#d98f9c" />
    <circle cx="265" cy="26" r="8" fill="#c45865" />
    <circle cx="295" cy="22" r="6" fill="#ffffff" />
    <circle cx="325" cy="28" r="7" fill="#d98f9c" />
    <circle cx="350" cy="30" r="6" fill="#c45865" />
  </g>
</svg>
