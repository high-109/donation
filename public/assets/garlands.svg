  <circle cx="75" cy="65" r="3" fill="#ffd9a8" />
  <circle cx="75" cy="78" r="4" fill="#e8b4b8" />
  <circle cx="75" cy="92" r="5" fill="#d4af7a" />
  
  <!-- Cluster 2 -->
  <line x1="150" y1="20" x2="150" y2="70" stroke="rgba(212,175,122,0.6)" stroke-width="1" />
