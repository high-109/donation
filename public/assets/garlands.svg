  <circle cx="450" cy="50" r="4" fill="#ffd9a8" />
  <circle cx="450" cy="70" r="5" fill="#e8b4b8" />

  <!-- Cluster 5 -->
  <line x1="525" y1="52" x2="525" y2="90" stroke="rgba(212,175,122,0.6)" stroke-width="1" />
  <circle cx="525" cy="65" r="3" fill="#ffd9a8" />
  <circle cx="525" cy="78" r="4" fill="#e8b4b8" />
  <circle cx="525" cy="92" r="5" fill="#d4af7a" />
