  <path d="M295 86 L305 86 L302 108 L298 108 Z" fill="#d4af7a" />

  <!-- Cluster 4 -->
  <line x1="450" y1="20" x2="450" y2="70" stroke="rgba(212,175,122,0.6)" stroke-width="1" />
